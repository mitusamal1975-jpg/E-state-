<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstateAI - Find Your Dream Property</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: '#059669',
                        gold: '#D4AF37',
                        beige: '#FDFBF7'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FDFBF7; }
        .hero-bg {
            background: linear-gradient(rgba(5, 150, 105, 0.8), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?ixlib=rb-4.0.3&auto=format&fit=crop&w=2075&q=80') center/cover;
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b-4 border-emerald py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <div class="flex items-center">
                <span class="text-3xl font-extrabold text-emerald tracking-tight">Estate<span class="text-gold">AI</span></span>
            </div>
            <div class="space-x-4">
                <button class="text-emerald font-semibold hover:text-gold transition duration-300">Login</button>
                <button class="bg-emerald text-white px-5 py-2 rounded-lg font-semibold hover:bg-gold transition duration-300 shadow-md">Add Property</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-bg text-white py-24 px-4 text-center">
        <h1 class="text-5xl md:text-6xl font-bold mb-6 tracking-tight">Find Your Dream Property with <span class="text-gold">AI</span></h1>
        <p class="text-lg md:text-xl mb-10 max-w-2xl mx-auto font-light">Let our intelligent AI algorithms match you with the perfect home based on your lifestyle, budget, and preferences.</p>
        
        <!-- Smart Search Bar -->
        <div class="max-w-4xl mx-auto bg-white p-3 rounded-full shadow-lg flex flex-col md:flex-row items-center space-y-2 md:space-y-0">
            <input type="text" placeholder="e.g. 3BHK in Mumbai under ₹80 lakh..." class="w-full flex-grow px-6 py-3 rounded-full text-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald">
            <button class="w-full md:w-auto bg-gold text-white px-8 py-3 rounded-full font-bold hover:bg-emerald transition duration-300 whitespace-nowrap">Smart Search</button>
        </div>
    </section>

    <!-- Top AI Recommendations -->
    <section class="max-w-7xl mx-auto py-16 px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-end mb-10">
            <div>
                <h2 class="text-3xl font-bold text-gray-900 border-l-4 border-gold pl-3">Top AI Recommendations</h2>
                <p class="text-gray-500 mt-2">Curated just for you based on current market trends.</p>
            </div>
        </div>

        <!-- Properties Grid -->
        <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Loading State -->
            <div id="loading-state" class="col-span-full text-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald mx-auto mb-4"></div>
                <p class="text-gray-500">EstateAI is fetching the best properties for you...</p>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('properties-grid');
            
            fetch('http://localhost:5000/api/properties')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(properties => {
                    grid.innerHTML = ''; // Clear loading state
                    
                    if (properties.length === 0) {
                        grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-10">No properties found at the moment.</p>';
                        return;
                    }

                    properties.forEach(prop => {
                        const card = document.createElement('div');
                        card.className = "bg-white rounded-2xl overflow-hidden shadow-lg hover:shadow-xl transition-shadow duration-300 border border-gray-100 flex flex-col";
                        card.innerHTML = `
                            <div class="relative h-56">
                                <img src="${prop.image}" alt="${prop.title}" class="w-full h-full object-cover">
                                <span class="absolute top-4 left-4 bg-emerald text-white px-3 py-1 text-sm font-bold rounded-full shadow">AI Match 98%</span>
                            </div>
                            <div class="p-6 flex-grow flex flex-col justify-between">
                                <div>
                                    <h3 class="text-xl font-bold text-gray-900 mb-1">${prop.title}</h3>
                                    <p class="text-gray-500 mb-4 flex items-center">
                                        <svg class="w-4 h-4 mr-1 text-gold" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
                                        ${prop.location}
                                    </p>
                                    <div class="flex flex-wrap gap-2 mb-4">
                                        <span class="bg-gray-100 text-gray-700 px-3 py-1 rounded-md text-sm font-medium border border-gray-200">${prop.bhk} BHK</span>
                                        <span class="bg-gray-100 text-gray-700 px-3 py-1 rounded-md text-sm font-medium border border-gray-200">${prop.area}</span>
                                    </div>
                                </div>
                                <div class="flex items-center justify-between mt-4 border-t pt-4">
                                    <span class="text-2xl font-extrabold text-emerald">${prop.price}</span>
                                    <button class="bg-gold text-white px-4 py-2 rounded-lg font-semibold hover:bg-emerald transition duration-300 shadow">Schedule Visit</button>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch(error => {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-12 bg-red-50 rounded-xl border border-red-100">
                            <h3 class="text-xl font-bold text-red-600 mb-2">Backend Connection Required</h3>
                            <p class="text-red-500">Please make sure the Flask backend (app.py) is running on http://localhost:5000</p>
                        </div>
                    `;
                    console.error('Error fetching properties:', error);
                });
        });
    </script>
</body>
</html>
