<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstateAI - Find Your Dream Property</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Theme Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { emerald: '#10b981', gold: '#fbbf24', beige: '#fdfbf7' }
                }
            }
        }
    </script>
</head>
<body class="bg-beige font-sans">
    <!-- Navbar -->
    <nav class="bg-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-emerald-600">EstateAI</h1>
        <div>
            <button class="px-4 py-2 text-emerald-600 font-semibold hover:text-emerald-800">Login</button>
            <button class="px-4 py-2 bg-emerald-600 text-white rounded-lg font-semibold hover:bg-emerald-700 shadow-md">Add Property</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="text-center py-20 bg-emerald-50">
        <h2 class="text-4xl md:text-5xl font-bold text-gray-800 mb-4">Find Your Dream Property with <span class="text-emerald-600">AI</span></h2>
        <p class="text-gray-600 mb-8 max-w-xl mx-auto">Let our smart AI engine recommend the perfect home based on your lifestyle, budget, and location.</p>
        
        <!-- Smart Search Bar -->
        <div class="flex justify-center px-4">
            <div class="flex bg-white rounded-full shadow-lg p-2 max-w-3xl w-full">
                <input type="text" placeholder="e.g. 3BHK in Bhubaneswar under ₹80 lakh..." class="w-full px-6 py-2 rounded-l-full outline-none">
                <button onclick="fetchProperties()" class="bg-emerald-600 text-white px-8 py-2 rounded-full font-bold hover:bg-gold transition">Search</button>
            </div>
        </div>
    </header>

    <!-- AI Recommendations Section -->
    <main class="max-w-6xl mx-auto p-8">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-2xl font-bold text-gray-800">✨ AI Top Recommendations</h3>
        </div>
        
        <!-- Property Cards Container -->
        <div id="property-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <p class="text-gray-500">Click Search to load AI recommended properties...</p>
        </div>
    </main>

    <!-- JavaScript to connect Backend -->
    <script>
        async function fetchProperties() {
            const grid = document.getElementById('property-grid');
            grid.innerHTML = '<p class="text-emerald-600 font-bold">AI is analyzing properties...</p>';
            
            try {
                // Fetching data from our Python Flask Backend
                const response = await fetch('http://localhost:5000/api/recommendations');
                const result = await response.json();
                
                grid.innerHTML = ''; // Clear loading text
                
                result.data.forEach(property => {
                    const card = `
                        <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-100 hover:shadow-xl transition transform hover:-translate-y-1">
                            <img src="${property.image}" alt="${property.title}" class="w-full h-48 object-cover">
                            <div class="p-5">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-1 rounded-full font-bold">${property.type}</span>
                                    <h4 class="text-gold font-bold text-lg">${property.price}</h4>
                                </div>
                                <h3 class="text-xl font-bold text-gray-800 mb-1">${property.title}</h3>
                                <p class="text-gray-500 text-sm mb-4">📍 ${property.location}</p>
                                <div class="flex justify-between border-t pt-4 text-sm text-gray-600">
                                    <span>🛏️ ${property.bhk} BHK</span>
                                    <span>📐 ${property.area}</span>
                                </div>
                                <button class="w-full mt-4 bg-emerald-600 text-white py-2 rounded-lg font-bold hover:bg-emerald-700">Schedule Visit</button>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            } catch (error) {
                grid.innerHTML = `<p class="text-red-500">Error: Make sure your Python backend (app.py) is running!</p>`;
            }
        }
    </script>
</body>
</html>
